name: Linux multi-distro packages

on:
  push:
    branches:
      - main
      - dev
  create:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ReqFlow AI (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            g++ \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6sql6-sqlite \
            dpkg-dev

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Compile application and core tests
        run: cmake --build build --parallel 2

      - name: Run core tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux executable and Debian installer
        run: |
          tar -czf build/reqflow-ai-linux.tar.gz -C build reqflow-ai
          version=$(sed -n 's/^project(ReqFlowAI VERSION \([^ )]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          packaging/build-deb.sh build/reqflow-ai "$version" "build/reqflow-ai_${version}_amd64.deb"

      - name: Build Fedora RPM
        run: |
          version=$(sed -n 's/^project(ReqFlowAI VERSION \([^ )]*\).*/\1/p' CMakeLists.txt)
          docker run --rm \
            -e APP_VERSION="$version" \
            -v "$PWD:/work" -w /work \
            fedora:latest bash -lc '
              dnf -y install rpm-build && \
              mkdir -p /tmp/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS} && \
              cp build/reqflow-ai packaging/reqflow-ai.desktop /tmp/rpmbuild/SOURCES/ && \
              rpmbuild -bb --define "_topdir /tmp/rpmbuild" --define "_version $APP_VERSION" packaging/rpm/reqflow-ai.spec && \
              cp /tmp/rpmbuild/RPMS/x86_64/reqflow-ai-*.rpm /work/build/
            '

      - name: Build Arch Linux package
        run: |
          version=$(sed -n 's/^project(ReqFlowAI VERSION \([^ )]*\).*/\1/p' CMakeLists.txt)
          mkdir -p "$RUNNER_TEMP/reqflow-arch"
          cp packaging/arch/PKGBUILD packaging/reqflow-ai.desktop build/reqflow-ai "$RUNNER_TEMP/reqflow-arch/"
          sed -i "s/^pkgver=.*/pkgver=${version}/" "$RUNNER_TEMP/reqflow-arch/PKGBUILD"
          mkdir -p "$RUNNER_TEMP/reqflow-arch-out"
          docker run --rm \
            -v "$RUNNER_TEMP/reqflow-arch:/work" \
            -v "$RUNNER_TEMP/reqflow-arch-out:/out" \
            archlinux:latest bash -lc '
              pacman -Syu --noconfirm --needed base-devel qt6-base && \
              useradd -m builder && chown -R builder:builder /work && \
              su builder -c "cd /work && makepkg --noconfirm --cleanbuild" && \
              cp /work/reqflow-ai-*.pkg.tar.zst /out/
            '
          cp "$RUNNER_TEMP"/reqflow-arch-out/reqflow-ai-*.pkg.tar.zst build/

      - name: Upload Linux packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: reqflow-ai-linux-${{ github.ref_name }}-${{ github.sha }}
          path: |
            build/reqflow-ai-linux.tar.gz
            build/reqflow-ai_*.deb
            build/reqflow-ai-*.rpm
            build/reqflow-ai-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'create' && startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            prerelease_args=()
            title="ReqFlow AI ${tag} · Linux"
            notes="Release de ReqFlow AI para Linux, compilada y probada por GitHub Actions. Commit: ${GITHUB_SHA}. Incluye el tarball y paquetes para Ubuntu/Debian (.deb), Fedora (.rpm) y Arch Linux (pkg.tar.zst)."
          else
            tag="ci-${GITHUB_SHA:0:12}"
            prerelease_args=(--prerelease)
            title="ReqFlow AI CI ${GITHUB_SHA:0:7} · Linux"
            notes="Build automática de la rama main. No es una versión estable. Compilación y CTest pasaron en GitHub Actions. Commit: ${GITHUB_SHA}. Incluye el tarball y paquetes para Ubuntu/Debian (.deb), Fedora (.rpm) y Arch Linux (pkg.tar.zst)."
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" build/reqflow-ai-linux.tar.gz build/reqflow-ai_*.deb build/reqflow-ai-*.rpm build/reqflow-ai-*.pkg.tar.zst \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" build/reqflow-ai-linux.tar.gz build/reqflow-ai_*.deb build/reqflow-ai-*.rpm build/reqflow-ai-*.pkg.tar.zst \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes "$notes" \
              "${prerelease_args[@]}"
          fi
