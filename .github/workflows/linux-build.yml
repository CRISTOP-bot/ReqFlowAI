name: Linux build

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build:
    name: Build ReqFlow AI (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install Qt and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            g++ \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6sql6-sqlite \
            libyaml-cpp-dev

      - name: Install Rust toolchain
        # Fijado por SHA inmutable. Se fija el tip de master porque la rama "stable"
        # (b725eda5) es master + 1 commit y NO está en la historia de master: el README
        # de la action advierte que esas SHAs acaban basurándose y rompen el workflow.
        # La toolchain se elige ahora de forma explícita con "toolchain: stable".
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master (equivale a @stable)
        with:
          toolchain: stable

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Test Rust backend
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Compile executable and core tests
        run: cmake --build build --parallel 2

      - name: Run Qt core tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux executable
        run: tar -czf build/reqflow-ai-linux.tar.gz -C build reqflow-ai

      - name: Upload Linux executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: reqflow-ai-linux-${{ github.ref_name }}
          path: build/reqflow-ai-linux.tar.gz
          if-no-files-found: error
