name: Linux build

on:
  push:
    branches:
      - main
      - dev
  create:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ReqFlow AI (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            g++ \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6sql6-sqlite

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Compile application and core tests
        run: cmake --build build --parallel 2

      - name: Run core tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux executable
        run: tar -czf build/reqflow-ai-linux.tar.gz -C build reqflow-ai

      - name: Upload Linux executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: reqflow-ai-linux-${{ github.ref_name }}-${{ github.sha }}
          path: build/reqflow-ai-linux.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'create' && startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            prerelease_args=()
            title="ReqFlow AI ${tag} · Linux"
            notes="Release de ReqFlow AI para Linux, compilada y probada por GitHub Actions. Commit: ${GITHUB_SHA}. El archivo contiene el ejecutable; Qt 6 y sus bibliotecas de runtime deben estar disponibles en el sistema."
          else
            tag="ci-${GITHUB_SHA:0:12}"
            prerelease_args=(--prerelease)
            title="ReqFlow AI CI ${GITHUB_SHA:0:7} · Linux"
            notes="Build automática de la rama main. No es una versión estable. Compilación y CTest pasaron en GitHub Actions. Commit: ${GITHUB_SHA}. El archivo contiene el ejecutable; Qt 6 y sus bibliotecas de runtime deben estar disponibles en el sistema."
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" build/reqflow-ai-linux.tar.gz \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" build/reqflow-ai-linux.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes "$notes" \
              "${prerelease_args[@]}"
          fi
