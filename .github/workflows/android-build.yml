name: Android APK build

on:
  push:
    branches: [dev]
    paths:
      - 'CMakeLists.txt'
      - 'android/**'
      - 'backend/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'CMakeLists.txt'
      - 'android/**'
      - 'backend/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 26.1.10909125
  ANDROID_API: 34

jobs:
  build-apk:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout dev source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;34.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Qt 6.8.3 for Android arm64-v8a
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          cache: true

      - name: Install Rust Android target
        # Fijado por SHA inmutable. Se fija el tip de master porque la rama "stable"
        # (b725eda5) es master + 1 commit y NO está en la historia de master: el README
        # de la action advierte que esas SHAs acaban basurándose y rompen el workflow.
        # La toolchain se elige ahora de forma explícita con "toolchain: stable".
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master (equivale a @stable)
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Configure Android cross-build
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}" \
            -DANDROID_NDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/$ANDROID_NDK_VERSION" \
            -DCMAKE_ANDROID_NDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/$ANDROID_NDK_VERSION" \
            -DCMAKE_SYSTEM_VERSION="$ANDROID_API" \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DANDROID_ABI=arm64-v8a \
            -DBUILD_TESTING=OFF

      - name: Build and package APK
        run: cmake --build build-android --target apk --parallel 2

      - name: Verify APK archive and native ABI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          candidates = sorted(Path('.').glob('build-android/**/*.apk'))
          valid = []
          for apk in candidates:
              try:
                  with zipfile.ZipFile(apk) as archive:
                      names = archive.namelist()
                      libs = [name for name in names if name.startswith('lib/') and name.endswith('.so')]
                      if 'AndroidManifest.xml' in names and libs and all(name.startswith('lib/arm64-v8a/') for name in libs):
                          valid.append((apk, len(libs)))
              except (OSError, zipfile.BadZipFile):
                  continue

          if not valid:
              print('No valid arm64-v8a APK found. Candidate APK paths:')
              for apk in candidates:
                  print(f' - {apk} ({apk.stat().st_size} bytes)')
              raise SystemExit('APK must contain AndroidManifest.xml and arm64-v8a native libraries.')

          apk, library_count = valid[0]
          Path('dist').mkdir(exist_ok=True)
          destination = Path('dist/reqflow-ai-android-arm64-v8a.apk')
          destination.write_bytes(apk.read_bytes())
          print(f'APK verified: {apk}; arm64-v8a native libraries: {library_count}')
          PY

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: reqflow-ai-android-arm64-v8a
          path: dist/reqflow-ai-android-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
