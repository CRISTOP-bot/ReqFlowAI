name: Android APK build

on:
  push:
    branches: [dev]
    paths:
      - 'CMakeLists.txt'
      - 'android/**'
      - 'backend/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'CMakeLists.txt'
      - 'android/**'
      - 'backend/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 26.1.10909125
  ANDROID_API: 34

jobs:
  build-apk:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout dev source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;34.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Qt 6.8.3 for Android arm64-v8a
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          cache: true

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure Android cross-build
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}" \
            -DANDROID_NDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/$ANDROID_NDK_VERSION" \
            -DCMAKE_ANDROID_NDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/$ANDROID_NDK_VERSION" \
            -DCMAKE_SYSTEM_VERSION="$ANDROID_API" \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DANDROID_ABI=arm64-v8a \
            -DBUILD_TESTING=OFF

      - name: Build and package APK
        run: cmake --build build-android --target apk --parallel 2

      - name: Verify APK archive and native ABI
        run: |
          APK="$(find build-android -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              assert 'AndroidManifest.xml' in names, 'APK has no Android manifest'
              libs = [n for n in names if n.startswith('lib/') and n.endswith('.so')]
              assert libs, 'APK has no native libraries'
              assert all(n.startswith('lib/arm64-v8a/') for n in libs), f'unexpected native ABI entries: {libs}'
              print(f'APK verified: {apk}; arm64-v8a native libraries: {len(libs)}')
          PY
          mkdir -p dist
          cp "$APK" dist/reqflow-ai-android-arm64-v8a.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reqflow-ai-android-arm64-v8a
          path: dist/reqflow-ai-android-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
