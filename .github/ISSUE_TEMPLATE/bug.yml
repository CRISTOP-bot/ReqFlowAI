name: "Reportar un bug"
description: "Algo no funciona como se esperaba en ReqFlow AI."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar un bug. Cuanto más detalle des, más fácil será reproducirlo.
        **Si encontraste una vulnerabilidad de seguridad, no abras este issue público**: sigue el proceso de [SECURITY.md](https://github.com/CRISTOP-bot/ReqFlowAI/blob/dev/docs/SECURITY.md).
  - type: textarea
    id: que-ocurre
    attributes:
      label: "Qué ocurre"
      description: "Describe el fallo: qué estabas haciendo, qué mensaje o comportamiento obtuviste."
      placeholder: "Ej.: al importar un archivo OpenAPI la aplicación se queda sin responder sin mostrar mensaje."
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: "Pasos para reproducir"
      description: "Lista numerada de pasos mínimos para volver a ocurrir."
      placeholder: |
        1. Abrir la aplicación
        2. Ir a ...
        3. Pulsar ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: "Comportamiento esperado"
      description: "Qué creías que debería ocurrir."
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: "Entorno"
      description: "Sistema operativo y versión; versión de Qt o compilador si lo sabes; versión, rama o commit de ReqFlow AI."
      placeholder: "Ej.: Fedora 44, Qt 6.12.0, rama dev, commit af0043c"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: "Información adicional"
      description: "Capturas, logs, archivos de ejemplo o cualquier otro dato útil. No pegues tokens ni credenciales reales."
  - type: checkboxes
    id: comprobaciones
    attributes:
      label: "Comprobaciones"
      options:
        - label: "He buscado entre los issues abiertos y no reporto un duplicado."
          required: true
        - label: "Sé que el proyecto está en desarrollo y que un reporte no implica soporte garantizado."
          required: true
